name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: [www/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # The Gemfile.lock (jekyll 3.8.5, ffi 1.9.25) does not build on current runners.
      - run: gem install jekyll -v 3.10.0 --no-document && gem install kramdown-parser-gfm --no-document
      - run: jekyll _3.10.0_ build
        env:
          JEKYLL_NO_BUNDLER_REQUIRE: 'true'
      # Netlify matched URLs without case. Add lowercase copies of mixed-case pages.
      - run: |
          find _site -name '*[A-Z]*.html' | while read -r f; do
            l=$(echo "$f" | tr 'A-Z' 'a-z')
            [ -e "$l" ] || { mkdir -p "$(dirname "$l")"; cp "$f" "$l"; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/_site
      - id: deployment
        uses: actions/deploy-pages@v4
