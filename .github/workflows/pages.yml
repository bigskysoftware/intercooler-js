name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: [www/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      # The Gemfile.lock pins ffi 1.9.25, which does not compile on current runners.
      - run: gem install jekyll -v 3.8.5 --no-document
      - run: jekyll _3.8.5_ build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/_site
      - id: deployment
        uses: actions/deploy-pages@v4
